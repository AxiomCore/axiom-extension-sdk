name: Publish one extension SDK package
run-name: extension-${{ inputs.component }}-${{ inputs.version }}-${{ inputs.request_id || 'manual' }}

# Deliberately manual: no push or tag implicitly publishes a package.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Package to publish
        required: true
        type: choice
        options: [rust-abi, rust-derive, rust-sdk, typescript-sdk, python-sdk]
      version:
        description: Exact version committed in the owning manifest
        required: true
        type: string
      request_id:
        description: Unique release-plane handoff ID (leave blank for manual releases)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
      - name: Verify version and build archive
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 -B scripts/verify_release_input.py "$COMPONENT" "$VERSION"
          mkdir -p release-archives
          case "$COMPONENT" in
            rust-abi|rust-derive|rust-sdk)
              case "$COMPONENT" in
                rust-abi) package=axiom-extension-abi ;;
                rust-derive) package=axiom-extension-sdk-derive ;;
                rust-sdk) package=axiom-extension-sdk ;;
              esac
              cargo test --workspace --locked
              if [ "$COMPONENT" = rust-sdk ]; then
                # The ABI and derive crates may have been published only moments
                # ago. Wait for Cargo's registry index to expose both versions.
                package_log="$RUNNER_TEMP/axiom-cargo-package.stderr"
                for attempt in {1..12}; do
                  if cargo package --locked -p "$package" 2>"$package_log"; then
                    cat "$package_log" >&2
                    break
                  fi
                  cat "$package_log" >&2
                  if ! grep -Eq 'no matching package named `(axiom-extension-abi|axiom-extension-sdk-derive)` found|failed to select a version for the requirement `(axiom-extension-abi|axiom-extension-sdk-derive)' "$package_log" || [ "$attempt" -eq 12 ]; then
                    exit 1
                  fi
                  echo "Waiting for published Rust SDK dependencies in the crates.io index (attempt $attempt/12)"
                  sleep 15
                done
              else
                cargo package --locked -p "$package"
              fi
              cp "target/package/$package-$VERSION.crate" release-archives/
              ;;
            typescript-sdk)
              npm ci --ignore-scripts --prefix typescript
              npm test --prefix typescript
              npm pack ./typescript --pack-destination release-archives --ignore-scripts
              ;;
            python-sdk) uv build python --out-dir release-archives ;;
          esac
      - name: Inspect the final package bytes
        run: |
          scanner_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_archive" | sha256sum --check --status
          tar -xzf "$scanner_archive" -C "$RUNNER_TEMP" gitleaks
          mkdir -p release-inspections
          for archive in release-archives/*; do
            python3 -B scripts/check_release_artifact.py --artifact "$archive" --signatures .github/security/signatures.json --scanner "$RUNNER_TEMP/gitleaks" --receipt "release-inspections/$(basename "$archive").json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package-inspection
          path: release-inspections/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: release-archives/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: package-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-archives
      - uses: actions/download-artifact@v4
        with:
          name: extension-package-inspection
          path: release-inspections
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@v6
      - name: Publish reviewed archive
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 -B scripts/verify_release_input.py "$COMPONENT" "$VERSION"
          python3 -B scripts/verify_inspected_packages.py --archives release-archives --receipts release-inspections --signatures .github/security/signatures.json
          case "$COMPONENT" in
            rust-abi|rust-derive|rust-sdk)
              for archive in release-archives/*.crate; do
                python3 -B scripts/publish_reviewed_crate.py --archive "$archive" --receipt "release-inspections/$(basename "$archive").json" --signatures .github/security/signatures.json --version "$VERSION"
              done
              ;;
            typescript-sdk)
              npm install -g npm@11.5.1
              archive="$PWD/release-archives/axiomcore-extension-sdk-$VERSION.tgz"
              test -f "$archive"
              npm publish "$archive" --provenance --access public --ignore-scripts
              ;;
            python-sdk) uv publish release-archives/* ;;
          esac

  mirror:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    environment: package-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: release-archives
      - uses: actions/download-artifact@v4
        with:
          name: extension-package-inspection
          path: release-inspections
      - name: Mirror public archive into AxiomCore Releases
        env:
          GH_TOKEN: ${{ secrets.AXIOMCORE_RELEASE_ASSET_TOKEN }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          SDK_COMMIT: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          python3 -B scripts/verify_inspected_packages.py --archives release-archives --receipts release-inspections --signatures .github/security/signatures.json
          tag="extension-$COMPONENT-v$VERSION"
          if ! gh release view "$tag" --repo AxiomCore/AxiomCore >/dev/null 2>&1; then
            gh release create "$tag" --repo AxiomCore/AxiomCore --target main \
              --title "Extension $COMPONENT $VERSION" \
              --notes "Package source: https://github.com/AxiomCore/axiom-extension-sdk/tree/$SDK_COMMIT"
          fi
          gh release upload "$tag" release-archives/* --repo AxiomCore/AxiomCore
